<svg xmlns="http://www.w3.org/2000/svg" width="703" height="282" viewBox="0 0 703 282" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
<rect width="703" height="282" rx="8" fill="#191d24"/>
<circle cx="20" cy="21" r="6" fill="#e06c62"/>
<circle cx="40" cy="21" r="6" fill="#e0b562"/>
<circle cx="60" cy="21" r="6" fill="#8fbf72"/>
<text x="351.5" y="26" fill="#7a8496" text-anchor="middle" font-size="12">odin-tutor — same output, different memory</text>
<text x="20" y="42" fill="#d8dee9" xml:space="preserve">parte := todos[1:]   A WINDOW                 parte := []int{2, 3}   A COPY</text>
<text x="20" y="62" fill="#d8dee9" xml:space="preserve">both print `3 2`                              both print `3 2`</text>
<text x="20" y="82" fill="#d8dee9" xml:space="preserve"></text>
<text x="20" y="102" fill="#88c0d0" xml:space="preserve">OBJECTS                                       OBJECTS</text>
<text x="20" y="122" fill="#a3be8c" xml:space="preserve">  [2] struct []int (3)   shares with [4]        [2] struct []int (3)</text>
<text x="20" y="142" fill="#d8dee9" xml:space="preserve">      [0] = 1                                       [0] = 1</text>
<text x="20" y="162" fill="#d8dee9" xml:space="preserve">      [1] = 2                                       [1] = 2</text>
<text x="20" y="182" fill="#d8dee9" xml:space="preserve">      [2] = 3                                       [2] = 3</text>
<text x="20" y="202" fill="#a3be8c" xml:space="preserve">  [4] struct []int (2)   shares with [2]        [4] struct []int (2)</text>
<text x="20" y="222" fill="#d8dee9" xml:space="preserve">      [0] = 2                                       [0] = 2</text>
<text x="20" y="242" fill="#d8dee9" xml:space="preserve">      [1] = 3                                       [1] = 3</text>
</svg>